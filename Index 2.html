<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma descoberta especial para o nosso encontro</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ouro:#c19a45;--ouro-claro:#f7f0e1;--texto:#2d2a26;--suave:#7a7368;--borda:#ece6da;--fundo:#fdfcfa}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--fundo);color:var(--texto)}
  .wrap{max-width:740px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(60px + env(safe-area-inset-bottom,0px))}
  header{text-align:center;margin-bottom:22px}
  .cruz{font-size:28px;color:var(--ouro)}
  h1{font-size:clamp(22px,5vw,31px);font-weight:800;margin:8px 0 6px;letter-spacing:-.3px}
  .sub{color:var(--suave);font-size:15px;margin:0;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
  .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;color:#fff;white-space:nowrap}
  .card{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(80,60,20,.06);margin-bottom:16px}
  .tela{display:none}.tela.ativa{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}
  input{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:1.5px solid var(--borda);border-radius:12px;outline:none}
  input:focus{border-color:var(--ouro)}
  .btn{border:none;font:inherit;font-weight:700;font-size:16px;padding:14px 22px;border-radius:12px;cursor:pointer;background:var(--ouro);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sec{background:#fff;color:var(--texto);border:1.5px solid var(--borda)}
  .full{width:100%;margin-top:14px}
  .progresso{height:8px;background:var(--ouro-claro);border-radius:99px;overflow:hidden;margin-bottom:10px}
  .progresso div{height:100%;background:var(--ouro);transition:width .3s}
  .meta{font-size:13px;color:var(--suave);margin-bottom:14px}
  .pergunta{font-size:20px;font-weight:700;line-height:1.35;margin:0 0 16px}
  .opcao{display:block;width:100%;text-align:left;font:inherit;font-size:16px;line-height:1.4;padding:15px 16px;margin-bottom:10px;border:1.5px solid var(--borda);border-radius:12px;background:#fff;cursor:pointer;color:var(--texto)}
  .opcao:hover{border-color:var(--ouro)}
  .opcao.sel{border-color:var(--ouro);background:var(--ouro-claro);font-weight:700}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  .destaque{text-align:center;border:2px solid var(--ouro);background:linear-gradient(180deg,#fff,var(--ouro-claro))}
  .grande{font-size:25px;font-weight:800;margin:6px 0}
  .santo-res{margin-bottom:26px}
  .topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .topo b{font-size:16px}.topo span{font-weight:800;font-size:18px}
  .barra{height:16px;background:#f2eee6;border-radius:99px;overflow:hidden}
  .barra div{height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .porque{font-size:14.5px;line-height:1.6;color:#4a453d;margin-top:10px}
  .porque p{margin:0 0 8px}
  .porque ul{margin:6px 0 10px;padding-left:18px}
  .porque li{margin-bottom:6px}
  .convite{background:var(--ouro-claro);border-radius:10px;padding:10px 12px;font-size:14px}
  .historia{font-size:14px;line-height:1.55;color:#5a544a;background:var(--ouro-claro);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .centro{text-align:center}
  .pct{font-size:58px;font-weight:800;line-height:1.05}
.afinidade{text-align:center;color:#7a6654;font-size:17px;margin:24px 0 8px}.pct{text-align:center;font-size:72px;line-height:1;font-weight:800;margin-top:20px}.santo-destaque{text-align:center;font-size:34px;line-height:1.15;font-weight:800;margin:14px 0 20px}.placar{width:max-content;max-width:90%;margin:0 auto 20px;color:#fff;border-radius:999px;padding:10px 20px;font-size:16px;font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="cruz">✝</div>
    <h1>Uma descoberta especial para o nosso encontro</h1>
    <p class="sub">Os Santos que aparecem nas próximas 10 perguntas vieram das respostas de vocês no Google Forms.</p>
    <p class="sub">Não existe resposta certa ou errada. Responda com o coração, pensando em como você realmente age.</p>
    <div class="chips" id="chips"></div>
  </header>

  <section id="t-inicio" class="tela ativa">
    <div class="card">
      <label for="nome">Qual é o seu nome?</label>
      <input id="nome" maxlength="50" placeholder="Digite seu nome" autocomplete="off">
      <button class="btn full" onclick="iniciar()">Começar</button>
    </div>
  </section>

  <section id="t-quiz" class="tela">
    <div class="card">
      <div class="progresso"><div id="prog"></div></div>
      <div class="meta" id="cont"></div>
      <div class="historia" id="historia"></div>
      <div class="pergunta" id="pergunta"></div>
      <div id="opcoes"></div>
      <div class="nav">
        <button class="btn sec" id="bVoltar" onclick="voltar()">Voltar</button>
        <button class="btn" id="bAvancar" onclick="avancar()" disabled>Próxima</button>
      </div>
    </div>
  </section>

  <section id="t-res" class="tela">
    <div class="card destaque" id="destaque"></div>
    <div class="card"><div id="lista"></div></div>
    <div class="centro"><button class="btn sec" onclick="reiniciar()">Responder novamente</button></div>
  </section>
</div>

<script>
var S={"d": {"n": "Nossa Senhora das Dores", "t": "Ela ficou ao pé da cruz quando tudo parecia perdido e mostrou que a presença consola mais do que mil palavras. O seu jeito de estar junto, mesmo em silêncio, é um abrigo para muita gente. Que nesta semana alguém sinta o seu colo e que você também se deixe acolher."}, "f": {"n": "São Francisco", "t": "Francisco descobriu que a vida fica leve quando agradecemos pelo pouco. O seu jeito de enxergar beleza no simples faz bem a quem está perto. Que nesta semana você pare para agradecer por um detalhe bonito e o guarde com carinho."}, "r": {"n": "Santa Rita de Cássia", "t": "Diz a tradição que, em pleno inverno, uma rosa floresceu para Rita. O seu jeito de perdoar e de não desistir mostra que o amor é mais forte do que a dor. Que nesta semana uma porta que parecia fechada comece a se abrir."}, "l": {"n": "São Lucas", "t": "Lucas cuidou de quem sofria com atenção e delicadeza, e registrou com carinho a história de Jesus. O seu cuidado nos detalhes diz muito sobre o seu coração. Que nesta semana você receba o mesmo cuidado que oferece aos outros."}, "p": {"n": "São Pio de Pietrelcina (Padre Pio)", "t": "Padre Pio passou horas ouvindo quem o procurava, sempre com verdade e amor. O seu jeito sincero e firme dá segurança a quem confia em você. Que nesta semana um momento de silêncio te lembre do que o seu coração já sabe."}, "c": {"n": "Nossa Senhora de Caravaggio", "t": "Caravaggio veio ao encontro de uma camponesa simples e deixou uma mensagem de paz. O seu jeito de reaproximar corações é um presente raro. Que nesta semana você reencontre alguém ou algo que andava distante."}, "g": {"n": "Nossa Senhora de Guadalupe", "t": "Guadalupe se mostrou a Juan Diego, um homem simples, e lembrou que ninguém é pequeno demais para ser amado. O seu jeito de acolher faz as pessoas se sentirem em casa. Que nesta semana você se sinta tão abraçado(a) quanto abraça os outros."}};
var Q=[["Quando alguém que você ama precisa de você, o que vem primeiro?",[["Ficar ao lado, mesmo em silêncio","d"],["Trazer leveza e esperança","f"],["Lembrar que vale a pena não desistir","r"],["Cuidar com atenção","l"],["Ouvir e falar com sinceridade","p"],["Ajudar a restaurar a paz","c"],["Fazer a pessoa se sentir acolhida","g"]],"Uma das figuras lembradas é uma Mãe que permaneceu de pé quando quase tudo parecia perdido. Para essa história, estar junto de quem sofria dizia mais do que qualquer palavra."],["Quando a vida aperta, onde você encontra força?",[["Em permanecer firme junto de quem amo","d"],["Na simplicidade e na gratidão","f"],["Na esperança de que uma porta vai se abrir","r"],["Em agir com cuidado e atenção","l"],["Na oração e na verdade","p"],["Na união com quem caminha comigo","c"],["Na certeza de que ninguém é pequeno demais","g"]],"Pense em alguém que abriu mão de riquezas para viver de forma simples... E em uma senhora que continuou firme mesmo quando muitas portas pareciam fechadas."],["Qual gesto mais parece com o seu jeito de amar?",[["Estar presente nos momentos difíceis","d"],["Alegrar a vida com coisas simples","f"],["Perdoar e dar uma nova chance","r"],["Cuidar dos pequenos detalhes","l"],["Dizer a verdade com carinho","p"],["Aproximar quem estava distante","c"],["Acolher sem fazer distinção","g"]],"Entre essas histórias, existe uma esposa e mãe que transformou dor em perdão e também um médico que fez do cuidado uma maneira de viver a fé."],["Se alguém chegasse hoje de coração apertado, o que encontraria em você?",[["Companhia","d"],["Leveza","f"],["Esperança","r"],["Cuidado","l"],["Sinceridade","p"],["Paz","c"],["Acolhimento","g"]],"Uma pista: há um frade que passava longas horas escutando quem o procurava. E há também uma Mãe que mostrou a uma pessoa simples que ninguém é pequeno demais para ser amado."],["O que mais toca o seu coração em uma comunidade?",[["Ninguém enfrentar a dor sozinho","d"],["A alegria das coisas simples","f"],["A força de quem não desiste","r"],["O cuidado verdadeiro entre as pessoas","l"],["A fé vivida com sinceridade","p"],["A capacidade de reconciliar","c"],["Fazer todos se sentirem parte","g"]],"Uma das histórias começa com uma camponesa e uma mensagem de paz. Um encontro simples que acabaria tocando muito mais pessoas do que se poderia imaginar."],["Quando algo parece impossível, qual é o seu primeiro impulso?",[["Respirar e permanecer firme","d"],["Simplificar e seguir com leveza","f"],["Tentar mais uma vez","r"],["Entender o que precisa ser feito","l"],["Rezar e seguir com convicção","p"],["Buscar apoio e construir junto","c"],["Confiar e dar o primeiro passo","g"]],"Quem será? Uma senhora atravessou perdas, esperas e situações consideradas quase impossíveis sem deixar que uma porta fechada fosse a última palavra."],["Qual dessas atitudes você mais gostaria de espalhar por onde passa?",[["Presença","d"],["Gratidão","f"],["Esperança","r"],["Cuidado","l"],["Verdade","p"],["Reconciliação","c"],["Acolhimento","g"]],"Olhe para as pistas: um homem via a criação como família; em outra história, uma Mãe escolheu justamente uma pessoa simples para levar sua mensagem."],["Em um dia muito feliz, o que você tem vontade de fazer?",[["Compartilhar com quem sempre esteve ao meu lado","d"],["Agradecer e aproveitar cada detalhe","f"],["Celebrar tudo o que consegui superar","r"],["Cuidar para que todos também estejam bem","l"],["Reservar um momento para agradecer em oração","p"],["Reunir pessoas queridas","c"],["Chamar para perto quem poderia estar sozinho","g"]],"Há um frade marcado pela oração e pelo silêncio. Há também um homem que encontrou alegria na gratidão, na simplicidade e nas pequenas coisas."],["Que lembrança você gostaria de deixar no coração das pessoas?",[["Eu estive ao lado delas","d"],["Eu tornei a vida mais leve","f"],["Eu as ajudei a não desistir","r"],["Eu cuidei delas com carinho","l"],["Eu fui verdadeiro(a) e soube ouvir","p"],["Eu ajudei a construir pontes","c"],["Eu fiz com que se sentissem em casa","g"]],"Já dá para ligar alguns pontos: uma Mãe junto à cruz, um médico e evangelista, um frade, uma rosa em pleno inverno e aparições a pessoas simples."],["Para fechar: qual palavra você quer levar deste encontro?",[["Presença","d"],["Alegria","f"],["Esperança","r"],["Cuidado","l"],["Fé","p"],["União","c"],["Acolhimento","g"]],"Última pista: você encontrou uma Mãe, uma esposa, um médico, um frade e alguém que escolheu uma vida simples. Qual dessas histórias será que mais se aproxima de você?"]];
const CLOSE="Chegamos ao fim do nosso encontro, {n}. Mais importante do que o Santo que apareceu é o que ele lembra: você é amado(a), o seu jeito de viver faz diferença na vida de quem está ao seu lado, e a esperança continua viva em cada gesto simples. Leve esse carinho para casa, para a sua família e para a sua semana. Que os Santos que lembramos hoje caminhem com você. Até o próximo encontro! 🙏";
const U=['d','f','r','l','p','c','g'];
const COR={d:'#7a4a5e',f:'#6b4f3a',r:'#8a5aa8',l:'#3b82a8',p:'#b0873a',c:'#3a8a7a',g:'#d0708c'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const embaralhar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mostrar(id){document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));$(id).classList.add('ativa');scrollTo(0,0)}
const chipsHTML=w=>U.map(k=>`<span class="chip" style="background:${COR[k]};${w&&w!==k?'opacity:.35':''}">${S[k].n}</span>`).join('');
$('chips').innerHTML=chipsHTML();
let nome='',atual=0,resp=[],ord=[];
function iniciar(){
  nome=$('nome').value.trim();
  if(!nome){$('nome').focus();$('nome').style.borderColor='#b4534b';return}
  atual=0;resp=new Array(Q.length).fill(null);
  ord=Q.map(q=>embaralhar(q[1].map((_,i)=>i)));
  mostrar('t-quiz');render();
}
$('nome').addEventListener('keydown',e=>{if(e.key==='Enter')iniciar()});
function render(){
  const q=Q[atual];
  $('prog').style.width=(atual/Q.length*100)+'%';
  $('cont').textContent=`Pergunta ${atual+1} de ${Q.length}`;
  $('pergunta').textContent=q[0];
  $('historia').textContent=q[2];
  $('opcoes').innerHTML=ord[atual].map((oi,k)=>`<button class="opcao ${resp[atual]===oi?'sel':''}" data-oi="${oi}">${String.fromCharCode(65+k)}) ${esc(q[1][oi][0])}</button>`).join('');
  $('opcoes').querySelectorAll('.opcao').forEach(b=>b.onclick=()=>{resp[atual]=+b.dataset.oi;render()});
  $('bVoltar').style.visibility=atual?'visible':'hidden';
  $('bAvancar').textContent=atual===Q.length-1?'Ver meu resultado':'Próxima';
  $('bAvancar').disabled=resp[atual]===null;
}
function voltar(){if(atual>0){atual--;render()}}
function avancar(){if(resp[atual]===null)return;if(atual<Q.length-1){atual++;render()}else resultado()}
function resultado(){
  const sc={};U.forEach(k=>sc[k]=0);resp.forEach((oi,i)=>sc[Q[i][1][oi][1]]++);
  const top=Math.max(...U.map(k=>sc[k]));const emp=U.filter(k=>sc[k]===top);const w=emp[Math.floor(Math.random()*emp.length)];const pct=Math.round((top/Q.length)*100);
  $('destaque').innerHTML=`<div class="afinidade">${esc(nome)}, o seu coração tem grande afinidade com...</div><div class="pct" style="color:${COR[w]}">${pct}%</div><div class="santo-destaque" style="color:${COR[w]}">${S[w].n}</div><div class="placar" style="background:${COR[w]}">${top} das ${Q.length} respostas tiveram essa afinidade</div><div class="porque" style="text-align:left"><p>${S[w].t}</p><div class="convite">💛 <b>Para fechar:</b> ${esc(CLOSE.replace('{n}',nome))}</div></div>`;
  $('lista').innerHTML=`<div class="meta"><b>Os Santos escolhidos pelos participantes do encontro de hoje</b></div><div class="chips" style="justify-content:flex-start;margin-top:0">${chipsHTML(w)}</div>`;mostrar('t-res');
}
function reiniciar(){$('nome').value='';mostrar('t-inicio')}
</script>
</body>
</html>
